version: 2
project_name: pushq

before:
  hooks:
    - go mod tidy

builds:
  - id: pushq
    main: ./cmd/pushq
    binary: pushq
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - { goos: windows, goarch: arm64 }
    ldflags:
      - -s -w
      - -X github.com/blissfulrays/pushq/internal/version.Version={{.Version}}
      - -X github.com/blissfulrays/pushq/internal/version.Commit={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  draft: true
  # Tags like v0.1.0-beta.1 are flagged as prereleases on GitHub, so they
  # don't show up as the project's "Latest release".
  prerelease: auto

