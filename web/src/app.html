<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<title>pushq</title>
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('pushq_theme');
					// Dark by default, like pushqueue.dev; the toggle remembers a choice.
					var dark = stored ? stored === 'dark' : true;
					if (dark) document.documentElement.classList.add('dark');
				} catch (e) {
					/* noop */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="min-h-screen bg-background font-sans text-foreground antialiased">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
