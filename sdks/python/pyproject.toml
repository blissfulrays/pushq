[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pushq"
version = "0.1.0"
description = "Client for pushq — self-hosted HTTP push task queue (open-source Cloud Tasks alternative)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]
keywords = ["task-queue", "queue", "cloud-tasks", "background-jobs", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]

[project.urls]
Homepage = "https://github.com/blissfulrays/pushq"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/pushq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
