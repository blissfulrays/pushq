[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pushq"
version = "1.0.0"
description = "Client for pushq — self-hosted HTTP push task queue (open-source Cloud Tasks alternative)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]
keywords = ["task-queue", "queue", "cloud-tasks", "background-jobs", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/blissfulrays/pushq"
Documentation = "https://github.com/blissfulrays/pushq/tree/main/sdks/python#readme"
Repository = "https://github.com/blissfulrays/pushq"
Issues = "https://github.com/blissfulrays/pushq/issues"
Changelog = "https://github.com/blissfulrays/pushq/releases"

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/pushq"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
