name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go vet ./...
      - run: go test -race ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pushq
          POSTGRES_PASSWORD: pushq
          POSTGRES_DB: pushq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pushq" --health-interval 2s
          --health-timeout 5s --health-retries 20
    env:
      PUSHQ_TEST_PG_URL: postgres://pushq:pushq@localhost:5432/pushq_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go test -race -count=1 ./internal/store/postgres/ ./test/e2e/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd web && npm install --no-audit --no-fund && npm run build

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: go build -o pushq ./cmd/pushq
      - run: cd sdks/typescript && npm install --no-audit --no-fund && npm run build
      # Catches broken ESM/CJS type resolution before it reaches npm, where
      # a published version can never be corrected — only superseded.
      - run: cd sdks/typescript && npm run check:exports
      - run: cd sdks/typescript && PUSHQ_BIN=$GITHUB_WORKSPACE/pushq npm test

  sdk-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Must cover the full range advertised in pyproject's
        # requires-python and classifiers.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: go build -o pushq ./cmd/pushq
      - run: cd sdks/python && pip install -e ".[dev]"
      - run: cd sdks/python && PUSHQ_BIN=$GITHUB_WORKSPACE/pushq pytest -q
      # The SDK is fully annotated; without py.typed shipping correctly,
      # consumers' type checkers silently ignore all of it.
      - name: Verify types are visible to consumers (PEP 561)
        run: |
          cd sdks/python
          pip install mypy build twine
          python -m build
          twine check dist/*
          python - <<'PY'
          import glob, zipfile, sys
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "pushq/py.typed" in names, f"py.typed missing from wheel: {names}"
          print("py.typed present in wheel")
          PY
          echo 'from pushq import Pushq
          x: int = Pushq("http://x").queue_stats("q").pending' > /tmp/consumer.py
          mypy /tmp/consumer.py

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd sdks/go && go vet ./... && go test ./...

  sdk-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build on a modern JDK to prove `maven.compiler.release=11` really
      # pins the bytecode level, rather than it passing only because the
      # build JDK happens to be 11.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: cd sdks/java && mvn -q --batch-mode package
      # Exercise the release profile (sources + javadoc jars) on every PR.
      # Javadoc errors are otherwise only discovered on release day.
      - run: cd sdks/java && mvn -q --batch-mode -P release -DskipTests -Dgpg.skip=true package
      - name: Verify publishable jar
        run: |
          cd sdks/java
          JAR=$(ls target/pushq-*.jar | grep -v -- '-sources\|-javadoc' | head -1)

          # Consumers on Java 11 get UnsupportedClassVersionError if this drifts.
          MAJOR=$(unzip -p "$JAR" io/pushq/Pushq.class | head -c 8 | od -An -tu1 | awk '{print $8}')
          test "$MAJOR" = "55" || { echo "bytecode major $MAJOR, expected 55 (Java 11)"; exit 1; }

          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Automatic-Module-Name: io.pushq' \
            || { echo "Automatic-Module-Name missing — JPMS name would be derived from the filename"; exit 1; }

          unzip -l "$JAR" | grep -q 'META-INF/LICENSE' || { echo "LICENSE not shipped in jar"; exit 1; }

          for suffix in sources javadoc; do
            ls target/pushq-*-$suffix.jar >/dev/null || { echo "$suffix jar missing (Maven Central requires it)"; exit 1; }
          done
          echo "jar OK: Java 11 bytecode, module name, license, sources + javadoc"
