name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go vet ./...
      - run: go test -race ./...

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pushq
          POSTGRES_PASSWORD: pushq
          POSTGRES_DB: pushq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pushq" --health-interval 2s
          --health-timeout 5s --health-retries 20
    env:
      PUSHQ_TEST_PG_URL: postgres://pushq:pushq@localhost:5432/pushq_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: go test -race -count=1 ./internal/store/postgres/ ./internal/accounts/ ./test/e2e/

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd web && npm install --no-audit --no-fund && npm run build
      - run: cd web && npm run check
      # The other Go jobs compile against the committed build/.gitkeep stub,
      # so this is the only place that proves the real dashboard embeds and
      # serves — including the SPA fallback for client-side routes.
      - name: Verify the dashboard embeds and serves
        run: |
          test -f web/build/index.html
          test -f web/build/.gitkeep   # build must not delete the stub
          go build -o pushq ./cmd/pushq
          ./pushq dev --listen :18080 --memory &
          for i in $(seq 30); do curl -sf localhost:18080/healthz >/dev/null && break; sleep 0.5; done

          curl -sf localhost:18080/ui/ | grep -q '<title>pushq</title>'
          curl -sf localhost:18080/ui/ | grep -q 'not bundled' \
            && { echo "placeholder served — real dashboard did not embed"; exit 1; }

          ASSET=$(curl -s localhost:18080/ui/ | grep -o '/ui/_app/immutable/entry/start[^"]*' | head -1)
          test -n "$ASSET" && curl -sf -o /dev/null "localhost:18080$ASSET"
          curl -sf -o /dev/null localhost:18080/ui/queues/demo   # SPA fallback
          echo "dashboard embedded and serving"

  sdk-typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: go build -o pushq ./cmd/pushq
      - run: cd sdks/typescript && npm install --no-audit --no-fund && npm run build
      # Catches broken ESM/CJS type resolution before it reaches npm, where
      # a published version can never be corrected — only superseded.
      - run: cd sdks/typescript && npm run check:exports
      - run: cd sdks/typescript && PUSHQ_BIN=$GITHUB_WORKSPACE/pushq npm test

  sdk-python:
    # Pinned: ubuntu-latest (26.04) has no Python 3.9 builds, and the SDK
    # still supports 3.9. Move to ubuntu-latest when 3.9 support is dropped.
    runs-on: ubuntu-24.04
    strategy:
      # One interpreter failing shouldn't hide results for the others.
      fail-fast: false
      matrix:
        # Must cover the full range advertised in pyproject's
        # requires-python and classifiers.
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: go build -o pushq ./cmd/pushq
      - run: cd sdks/python && pip install -e ".[dev]"
      - run: cd sdks/python && PUSHQ_BIN=$GITHUB_WORKSPACE/pushq pytest -q
      # The SDK is fully annotated; without py.typed shipping correctly,
      # consumers' type checkers silently ignore all of it.
      - name: Verify types are visible to consumers (PEP 561)
        run: |
          cd sdks/python
          pip install mypy build twine
          python -m build
          twine check dist/*
          python -c "import glob,zipfile,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'pushq/py.typed' in n else 'py.typed missing from wheel')"
          printf 'from pushq import Pushq\nx: int = Pushq("http://x").queue_stats("q").pending\n' > consumer_check.py
          mypy consumer_check.py

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: cd sdks/go && go vet ./... && go test ./...

  sdk-dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: go build -o pushq ./cmd/pushq
      # Unit tests plus integration tests against the real server.
      - run: cd sdks/dotnet && dotnet test tests/Pushq.Tests
        env:
          PUSHQ_BIN: ${{ github.workspace }}/pushq
      # Pack exactly as the release does and check what consumers would get.
      - name: Verify publishable package
        run: |
          cd sdks/dotnet
          dotnet pack src/Pushq -c Release -p:Version=0.0.0-ci -o out
          PKG=out/Pushq.0.0.0-ci.nupkg
          LIST=$(unzip -l "$PKG")
          for f in lib/netstandard2.0/Pushq.dll lib/netstandard2.0/Pushq.xml lib/net10.0/Pushq.dll README.md LICENSE; do
            echo "$LIST" | grep -q " $f\$" || { echo "$f missing from package"; exit 1; }
          done
          test -f out/Pushq.0.0.0-ci.snupkg || { echo "symbols package missing"; exit 1; }
          echo "package OK: netstandard2.0 + net10.0, docs, README, license, symbols"

  sdk-java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build on a modern JDK to prove `maven.compiler.release=11` really
      # pins the bytecode level, rather than it passing only because the
      # build JDK happens to be 11.
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: cd sdks/java && mvn -q --batch-mode package
      # Exercise the release profile (sources + javadoc jars) on every PR.
      # Javadoc errors are otherwise only discovered on release day.
      - run: cd sdks/java && mvn -q --batch-mode -P release -DskipTests -Dgpg.skip=true package
      - name: Verify publishable jar
        run: |
          cd sdks/java
          JAR=$(ls target/pushq-*.jar | grep -v -- '-sources\|-javadoc' | head -1)

          # Consumers on Java 11 get UnsupportedClassVersionError if this drifts.
          MAJOR=$(javap -verbose -cp "$JAR" io.pushq.Pushq | grep -m1 'major version' | tr -dc '0-9')
          test "$MAJOR" = "55" || { echo "bytecode major $MAJOR, expected 55 (Java 11)"; exit 1; }

          unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'Automatic-Module-Name: io.pushq' \
            || { echo "Automatic-Module-Name missing — JPMS name would be derived from the filename"; exit 1; }

          unzip -l "$JAR" | grep -q 'META-INF/LICENSE' || { echo "LICENSE not shipped in jar"; exit 1; }

          for suffix in sources javadoc; do
            ls target/pushq-*-$suffix.jar >/dev/null || { echo "$suffix jar missing (Maven Central requires it)"; exit 1; }
          done
          echo "jar OK: Java 11 bytecode, module name, license, sources + javadoc"
