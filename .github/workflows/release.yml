name: release

# Publishes everything at one version: binaries, the Docker image, and all
# four SDKs. Each SDK job no-ops until its credentials exist, so you can enable
# registries one at a time. See docs/publishing.md.
#
# Three ways in:
#   - Merge to main (automatic): once CI passes on main, the next version is
#     tagged and released — the next prerelease after a beta
#     (0.1.0-beta.4 -> 0.1.0-beta.5), otherwise the next patch. Skipped when
#     nothing that ships changed, or the commit message says [skip release].
#   - Run this workflow by hand with an explicit version (e.g. to cut 0.2.0).
#   - Push a vX.Y.Z tag yourself.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without the leading v), e.g. 0.2.0"
        required: true

permissions:
  contents: write

# One release at a time, in order, so two quick merges can't claim the same
# version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Automatic releases only follow a successful CI run for a push to main
    # (never a pull request, never a failed run).
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    outputs:
      release: ${{ steps.v.outputs.release }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      npm_tag: ${{ steps.v.outputs.npm_tag }}
      # The exact commit to build. Every job checks this out: for automatic
      # releases it is the commit CI tested, not whatever main points at now.
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_MSG: ${{ github.event.workflow_run.head_commit.message }}
        run: |
          set -euo pipefail
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          skip() {
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release::$1"
            exit 0
          }

          case "$EVENT" in
            workflow_dispatch) V="${INPUT_VERSION#v}" ;;
            push)              V="${GITHUB_REF_NAME#v}" ;;   # tag v0.1.0 -> 0.1.0
            workflow_run)
              if printf '%s' "$HEAD_MSG" | grep -qiE '\[(skip release|release skip|no release)\]'; then
                skip "the commit message asked to skip the release"
              fi
              if git tag --points-at HEAD | grep -q '^v'; then
                skip "this commit is already released as $(git tag --points-at HEAD | grep '^v' | head -1)"
              fi
              # Newest release tag; versionsort.suffix makes 0.1.0-beta.4 sort before 0.1.0.
              LAST=$(git -c versionsort.suffix=- tag -l 'v[0-9]*' --sort=-v:refname | head -1)
              if [ -z "$LAST" ]; then
                V="0.1.0-beta.1"
              else
                # Docs, CI and test-only merges don't publish anything.
                if [ -z "$(git diff --name-only "$LAST" HEAD -- cmd internal web sdks api go.mod go.sum Dockerfile .goreleaser.yaml)" ]; then
                  skip "nothing that ships has changed since $LAST"
                fi
                if [[ "$LAST" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-([0-9A-Za-z]+)\.([0-9]+)$ ]]; then
                  V="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
                elif [[ "$LAST" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                  V="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))"
                else
                  echo "::error title=Unknown version format::Can't work out the version after $LAST; run this workflow by hand with an explicit version."
                  exit 1
                fi
              fi
              ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"

          # Anything with a hyphen is a semver prerelease (beta, rc, alpha…).
          case "$V" in
            *-*)
              # 0.1.0-beta.1 -> "beta": the npm dist-tag users opt into.
              TAG="${V#*-}"; TAG="${TAG%%.*}"
              echo "prerelease=true"   >> "$GITHUB_OUTPUT"
              echo "npm_tag=$TAG"      >> "$GITHUB_OUTPUT"
              echo "Prerelease $V (npm dist-tag: $TAG)"
              ;;
            *)
              echo "prerelease=false"  >> "$GITHUB_OUTPUT"
              echo "npm_tag=latest"    >> "$GITHUB_OUTPUT"
              echo "Stable release $V"
              ;;
          esac

          # Make sure tag vX.Y.Z exists at this commit (created here for
          # automatic and manual runs). A tag pushed with GITHUB_TOKEN does not
          # trigger workflows, so this doesn't start a second release.
          TAG="v$V"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            if [ "$(git rev-list -n1 "$TAG")" != "$SHA" ]; then
              echo "::error title=Tag exists::$TAG already points at another commit."
              exit 1
            fi
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "::notice title=Releasing $TAG::from $SHA"

  goreleaser:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ needs.version.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Build dashboard
        run: cd web && npm install --no-audit --no-fund && npm run build
      - uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: v${{ needs.version.outputs.version }}

  docker:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.version.outputs.sha }}" }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A prerelease must not move :latest — `docker run ghcr.io/…/pushq`
      # has to keep pulling the newest stable image.
      - id: tags
        run: |
          V="${{ needs.version.outputs.version }}"
          # github.repository keeps the org's capitalisation (Blissfulrays/pushq)
          # but container registries reject uppercase in repository names.
          REPO="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "value<<TAGS"
            echo "${REPO}:${V}"
            if [ "${{ needs.version.outputs.prerelease }}" != "true" ]; then
              echo "${REPO}:latest"
            fi
            echo "TAGS"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            COMMIT=${{ github.sha }}
          tags: ${{ steps.tags.outputs.value }}

  # --- SDKs ---

  npm:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required by `npm publish --provenance`
    env:
      # Secrets aren't readable from a step `if:`; surface it as job env first.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.version.outputs.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - name: Set version and build
        run: |
          cd sdks/typescript
          npm pkg set version="${{ needs.version.outputs.version }}"
          npm install --no-audit --no-fund
          npm run build
      # Last gate before an immutable publish.
      - name: Validate package exports
        run: cd sdks/typescript && npm run check:exports
      # --tag is what keeps a prerelease off `npm install pushq`. Without it a
      # beta would silently become the default for every user.
      - name: Publish
        if: env.NPM_TOKEN != ''
        run: |
          cd sdks/typescript
          npm publish --provenance --access public --tag "${{ needs.version.outputs.npm_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    needs: version
    if: needs.version.outputs.release == 'true'
    # This job always runs and always builds + validates the distributions.
    # Only the upload is gated, so the log says plainly whether it published
    # and why not — a skipped job would just show empty output.
    runs-on: ubuntu-latest
    environment: pypi # PyPI Trusted Publishing is scoped to this environment
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.version.outputs.sha }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Set version and build
        run: |
          cd sdks/python
          V="${{ needs.version.outputs.version }}"
          sed -i "s/^version = .*/version = \"$V\"/" pyproject.toml
          sed -i "s/^__version__ = .*/__version__ = \"$V\"/" src/pushq/__init__.py
          pip install build twine
          python -m build
      # Last gate before an immutable upload: PyPI's own metadata validation
      # plus a check that the PEP 561 marker actually shipped.
      - name: Validate distributions
        run: |
          cd sdks/python
          twine check dist/*
          python -c "import glob,zipfile,sys; n=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); sys.exit(0 if 'pushq/py.typed' in n else 'py.typed missing from wheel')"
      # Publishes unconditionally via Trusted Publishing. If the OIDC identity
      # doesn't match the publisher registered on PyPI this fails loudly, which
      # is what you want — a silent skip looks identical to a successful
      # release that quietly shipped nothing.
      # skip-existing keeps re-runs safe when a version already uploaded.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true
          print-hash: true

  maven:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ needs.version.outputs.sha }}" }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          server-id: central # must match <publishingServerId> in pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      # "gpg: signing failed: No pinentry" means gpg fell back to prompting.
      # Two causes, both handled here: an empty passphrase secret, and a
      # gpg-agent that hasn't enabled loopback pinentry (headless runners have
      # no pinentry binary to fall back to).
      - name: Prepare GPG for headless signing
        if: env.MAVEN_CENTRAL_USERNAME != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          # Headless runners have no pinentry binary, so loopback must be
          # allowed or gpg tries to prompt and dies with "No pinentry".
          grep -q '^allow-loopback-pinentry' ~/.gnupg/gpg-agent.conf 2>/dev/null \
            || echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpgconf --kill gpg-agent || true

          KEY_ID=$(gpg --list-secret-keys --keyid-format=long --with-colons \
                   | awk -F: '/^sec/{print $5; exit}')
          test -n "$KEY_ID" || { echo "::error title=No GPG key::GPG_PRIVATE_KEY did not import a secret key. Export it with: gpg --armor --export-secret-keys <KEY_ID>"; exit 1; }
          echo "GPG_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"

          # Prove key + passphrase agree now, rather than 20s into a Maven
          # build. Works for both passphrase-protected and bare keys.
          if echo test | gpg --batch --yes --pinentry-mode loopback \
               --passphrase "$GPG_PASSPHRASE" --local-user "$KEY_ID" \
               --armor --detach-sign > /dev/null 2>&1; then
            if [ -z "$GPG_PASSPHRASE" ]; then
              echo "::notice title=Key has no passphrase::Signing works without one; continuing."
            else
              echo "signing verified with key $KEY_ID"
            fi
          elif [ -z "$GPG_PASSPHRASE" ]; then
            echo "::error title=GPG_PASSPHRASE is empty::Key $KEY_ID is passphrase-protected but the GPG_PASSPHRASE secret is unset. Add it under Settings > Secrets and variables > Actions."
            exit 1
          else
            echo "::error title=GPG_PASSPHRASE does not match::Key $KEY_ID rejected the supplied passphrase. Confirm the secret matches the key exported into GPG_PRIVATE_KEY."
            exit 1
          fi

      - name: Set version
        run: |
          cd sdks/java
          mvn -q --batch-mode versions:set \
            -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false
      - name: Publish to Maven Central
        if: env.MAVEN_CENTRAL_USERNAME != ''
        run: cd sdks/java && mvn -P release --batch-mode -Dgpg.keyname="$GPG_KEY_ID" deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # The Go SDK is a nested module: `go get .../sdks/go@vX.Y.Z` resolves the
  # tag `sdks/go/vX.Y.Z`, not the repo-root tag. Nothing to upload — the proxy
  # fetches from the tag itself.
  go-sdk-tag:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, ref: "${{ needs.version.outputs.sha }}" }
      - name: Tag sdks/go
        run: |
          TAG="sdks/go/v${{ needs.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists; nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
